services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deepguard
      MYSQL_USER: deepguard_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deepguard_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "deepguard_app", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://deepguard_app:$${MYSQL_PASSWORD}@db:3306/deepguard
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEVICE: ${DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/weights:/app/weights
      - ./backend/reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      DEEPGUARD_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
